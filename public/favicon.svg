  <!-- Inner Accent Ring -->
  <ellipse cx="50" cy="50" rx="42" ry="23" fill="none" stroke="#2B4C8C" stroke-width="1.2" stroke-opacity="0.3" />
  <!-- Slanted Bold Vibrant Royal Blue Text: LONETEX -->
  <text
    x="50"
    y="57"
    text-anchor="middle"
    font-family="'Montserrat', 'Arial Black', sans-serif"
