<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 75" fill="none">
  <!-- Outer Smooth Shadow Filter -->
  <defs>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Yellow Oval Badge with Vibrant Royal Blue Border -->
  <g filter="url(#badgeShadow)">
    <ellipse cx="110" cy="37.5" rx="104" ry="32" fill="#FFC700" stroke="#2B4C8C" stroke-width="4.5" />
    <!-- Inner Accent Ring -->
    <ellipse cx="110" cy="37.5" rx="97" ry="26" fill="none" stroke="#2B4C8C" stroke-width="1.2" stroke-opacity="0.3" />
  </g>

  <!-- Slanted Bold Vibrant Royal Blue Text: LONETEX -->
  <text
    x="110"
    y="48"
    text-anchor="middle"
    font-family="'Montserrat', 'Plus Jakarta Sans', 'Arial Black', sans-serif"
    font-size="33"
    font-weight="900"
    font-style="italic"
    letter-spacing="2.5"
    fill="#2B4C8C"
  >LONETEX</text>
</svg>
